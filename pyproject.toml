[project]
name = "llm-debate"
version = "0.1.0"
description = "Five-agent Gemini counseling dialogue prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
]

[tool.vercel]
entrypoint = "backend.main:app"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
